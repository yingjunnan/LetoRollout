name: build-and-push-image

# Builds the multi-stage Dockerfile (Node web build -> Go build -> distroless)
# and pushes the image to Docker Hub.
#
# Triggers:
#   - push to main             -> tag :latest
#   - push of a v* tag (v1.2.3) -> tags :1.2.3, :1.2, :1, :latest
#
# Required GitHub repository configuration:
#   Variable  DOCKERHUB_IMAGE   e.g.  yingjunnan/letorollout
#   Secret    DOCKERHUB_USERNAME
#   Secret    DOCKERHUB_TOKEN        (access token, not the account password)

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  # Allow running manually from the Actions tab for testing.
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        env:
          # Default mirrors the GitHub repo owner so the workflow works even
          # before the variable is configured, but the variable is authoritative.
          GH_OWNER: ${{ github.repository_owner }}
          DH_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          image="${DH_IMAGE:-${GH_OWNER}/letorollout}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${image}"

      - name: Compute tags
        id: tags
        env:
          # Strip a leading "v" so v1.2.3 -> 1.2.3
          REF: ${{ github.ref_name }}
        run: |
          image="${{ steps.image.outputs.name }}"
          tags="${image}:latest"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${REF#v}"
            # 1.2.3 -> :1.2.3, :1.2, :1 (in addition to :latest)
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            tags="${tags},${image}:${version},${image}:${major}.${minor},${image}:${major}"
          fi

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Computed tags: ${tags}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
