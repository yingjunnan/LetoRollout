apiVersion: apps/v1
kind: Deployment
metadata:
  name: letorollout
  namespace: default
  labels:
    app.kubernetes.io/name: letorollout
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: letorollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: letorollout
    spec:
      serviceAccountName: letorollout
      containers:
        - name: letorollout
          image: letorollout:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ADDR
              value: ":8080"
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: letorollout-auth
                  key: token
                  optional: true
            - name: ALLOWED_NAMESPACES
              value: ""
            - name: REQUIRED_DEPLOYMENT_LABEL
              value: ""
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: letorollout
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: letorollout
  ports:
    - name: http
      port: 80
      targetPort: http
