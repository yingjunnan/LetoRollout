apiVersion: apps/v1
kind: Deployment
metadata:
  name: letorollout
  namespace: default
  labels:
    app.kubernetes.io/name: letorollout
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: letorollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: letorollout
    spec:
      serviceAccountName: letorollout
      containers:
        - name: letorollout
          image: blichus/letorollout:latest
          imagePullPolicy: Always
          env:
            - name: ADDR
              value: ":8080"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: letorollout-admin-auth
                  key: admin-token
                  optional: true
            - name: TOKENS_PATH
              value: "/data/tokens.json"
            - name: LOG_TAIL_LINES
              value: "500"
            - name: ALLOWED_NAMESPACES
              value: ""
            - name: REQUIRED_DEPLOYMENT_LABEL
              value: ""
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: letorollout-data
---
apiVersion: v1
kind: Service
metadata:
  name: letorollout
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: letorollout
  ports:
    - name: http
      port: 80
      targetPort: http
