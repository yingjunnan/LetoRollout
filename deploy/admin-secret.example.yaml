# Example admin-token Secret for LetoRollout.
#
# The Deployment references this Secret to load ADMIN_TOKEN (see deploy/deployment.yaml).
# Copy this file to a local secret (e.g. deploy/admin-secret.yaml, which is gitignored),
# replace <your-admin-token-here> with a strong secret, then:
#
#   kubectl apply -f deploy/admin-secret.yaml
#
# Never commit the real token to git.

apiVersion: v1
kind: Secret
metadata:
  name: letorollout-admin-auth
  namespace: default
type: Opaque
stringData:
  admin-token: "<your-admin-token-here>"
